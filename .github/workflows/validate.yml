name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch base branch (pull requests only)
        if: github.event_name == 'pull_request'
        run: git fetch --depth=1 origin "${{ github.base_ref }}"
      - name: Validate (pull request, compared with base)
        if: github.event_name == 'pull_request'
        run: python3 scripts/validate.py --base "origin/${{ github.base_ref }}"
      - name: Validate (push to main)
        if: github.event_name == 'push'
        run: python3 scripts/validate.py
